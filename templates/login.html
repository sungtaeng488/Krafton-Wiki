<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KRAFTON WIKI 로그인">
  <title>로그인 | KRAFTON WIKI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
  <header class="login-header">
    <a class="brand" href="{{ url_for('main.index') }}" aria-label="KRAFTON WIKI 홈"><span>KRAFTON WIKI</span></a>
    <a class="login-header__link" href="{{ url_for('main.index') }}">메인으로</a>
  </header>

  <main class="login-shell">
    <section class="login-intro" aria-labelledby="page-title">
      <h1 id="page-title">다시 만나서<br>반가워요.</h1>
      <p>로그인하고 KRAFTON WIKI의 지식을 함께 기록하고 연결해 보세요.</p>
    </section>

    <section class="login-card" aria-labelledby="login-title">
      <h2 id="login-title">로그인</h2>
      <p class="login-card__description">계정 정보를 입력해 주세요.</p>

      {% if error %}
        <p class="notice notice--error" role="alert">{{ error }}</p>
      {% endif %}
      {% if registered %}
        <p class="notice notice--success" role="status">회원가입이 완료되었습니다. 로그인해주세요.</p>
      {% endif %}

      <form class="login-form" method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="next" value="{{ next_url or '' }}">
        <div class="field">
          <label for="login-id">아이디</label>
          <input id="login-id" type="text" name="id_give" placeholder="아이디를 입력하세요" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">비밀번호</label>
          <input id="login-password" type="password" name="password_give" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
        </div>
        <button type="submit">로그인</button>
      </form>

      <p class="login-links"><span>아직 계정이 없으신가요?</span><a href="{{ url_for('auth.signup') }}">회원가입</a></p>
    </section>
  </main>
</body>
</html>

<script>
    window.addEventListener('pageshow', function (event) {
        // event.persisted는 페이지가 브라우저 캐시에서 로드되었을 때 true
        if (event.persisted) {
            window.location.reload();
        }
    });
</script>
