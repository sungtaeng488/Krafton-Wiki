<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>새 글 작성</title>
</head>
<body>
  <h1>새 글 작성</h1>

  {% if error %}
    <p style="color: red;">{{ error }}</p>
  {% endif %}

  <form method="POST" action="{{ url_for('mypage.create_post') }}">
    <p>
      <label>
        제목
        <input type="text" name="title_give" required>
      </label>
    </p>

    <p>
      <label>
        내용
        <textarea name="content_give" rows="10" cols="60" required></textarea>
      </label>
    </p>

    <button type="submit">등록</button>
  </form>

  <p><a href="{{ url_for('mypage.mypage') }}">마이페이지로 돌아가기</a></p>
</body>
</html>
