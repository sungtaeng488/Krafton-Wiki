<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="함께 기록하고 성장하는 CS 지식 커뮤니티, KRAFTON WIKI">
    <title>KRAFTON WIKI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="/" aria-label="KRAFTON WIKI 홈">
                <span>KRAFTON WIKI</span>
            </a>

            <div class="header-actions">
                <!-- 검색 버튼: 클릭 시 search.html로 이동 -->
                {% if not hide_search %}
                <button class="icon-button" type="button" aria-label="검색" onclick="location.href='search'">
                    <span class="search-icon" aria-hidden="true"></span>
                </button>
            {% endif %}
    
                {% if load_user_id %}
                    <a class="login-button" href="{{ url_for('mypage.mypage') }}">마이페이지</a>
                    <form class="logout-form" method="POST" action="{{ url_for('auth.logout') }}">
                        <button class="logout-button" type="submit">로그아웃</button>
                    </form>
                {% else %}
                    <a class="login-button" href="{{ url_for('auth.login') }}">로그인</a>
                {% endif %}
            </div>
        </div>
    </header>
