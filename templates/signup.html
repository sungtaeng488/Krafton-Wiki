<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | KRAFTON WIKI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css')}}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css')}}">
  <style>
    .login-links a.blue-text {
      color : var(--brand);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header class="login-header">
    <a class="brand" href="{{url_for('main.index')}}">
      <span>KRAFTON WIKI</span>
    </a>
    <a class="login-header__link" href="{{ url_for('main.index')}}">
      메인으로
    </a>
  </header>

  <main class = "login-shell">
    <section class = "login-intro">
      <h1 id="page-title">함께 지식을 채워가요.</h1>
      <p>
        KRAFTON WIKI는 정글 구성원 모두가 함께 만드는<br>
        CS 지식 커뮤니티입니다.
      </p>
    </section>

    <section class = "login-card">
      <h2 id="login-title">
        회원가입
      </h2>
      <p class = "login-card__description">
        계정 정보를 입력해 주세요.
      </p>

      {% if error %}
        <p class="notice notice--error" role="alert">{{ error }}</p>
      {% endif %}

      <form class="login-form" method="POST" action="{{ url_for('auth.signup') }}">
        <div class="field">
          <label for="login-id">
            아이디
          </label>
          <input
            id="login-id"
            type="text"
            name="id_give"
            placeholder="아이디를 입력하세요"
            autocomplete="username"
            required
          >
        </div>

        <div class="field">
          <label for="login-password">
            비밀번호
          </label>

          <input
            id="login-password"
            type="password"
            name="password_give"
            placeholder="비밀번호를 입력하세요"
            autocomplete="new-password"
            required
          >
        </div>

        <button type="submit">회원가입</button>
      </form>

      <p class = "login-links">
        <span>
          이미 계정이 있으신가요?
        </span>
        <a class = "blue-text" href="{{ url_for('auth.login') }}">
            로그인
        </a>
      </p>
    </section>

  </main>

</body>
</html>

<script>
    window.addEventListener('pageshow', function (event) {
        // event.persisted는 페이지가 브라우저 캐시에서 로드되었을 때 true
        if (event.persisted) {
            window.location.reload();
        }
    });
</script>
