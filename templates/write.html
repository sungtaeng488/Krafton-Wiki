<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if post %}글 수정{% else %}새 글 작성{% endif %} · KRAFTON WIKI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/write.css') }}">
</head>
<body>
    {% include 'navigation_bar.html' %}

    <main class="page-shell">
        <div class="write-container">
            <header class="write-header">
                <h1>{% if post %}글 수정하기{% else %}새 글 작성{% endif %}</h1>
                <p>나만의 CS 지식을 기록하고 공유해 보세요.</p>
            </header>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="notice--error" role="alert">
                        ⚠️ {{ messages[0] }}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="{% if post %}/edit/{{ post._id }}{% else %}/write{% endif %}" method="POST">
                
                <div class="field">
                    <label for="title">제목</label>
                    <input type="text" id="title" name="title" value="{{ post.title if post else '' }}" placeholder="글 제목을 입력하세요" required>
                </div>

                <div class="field">
                    <label for="content">내용</label>
                    <textarea id="content" name="content" rows="16" placeholder="자유롭게 지식을 작성해 주세요." required>{{ post.content if post else '' }}</textarea>
                </div>

                <div class="field">
                    <label for="tags">태그 (#으로 구분)</label>
                    <input type="text" id="tags" name="tags" value="{{ post.tags_str if post else '' }}" placeholder="예: #quicksort #algorithm" required>
                </div>

                <div class="field">
                    <label for="summary">한줄요약</label>
                    <input type="text" id="summary" name="summary" value="{{ post.summary if post else '' }}" placeholder="글의 핵심 내용을 한 줄로 요약해 주세요.">
                </div>

                <div class="form-actions">
                    <button class="btn-cancel" type="button" onclick="location.href='{% if post %}{{ url_for('post.view_post', id=post._id) }}{% else %}{{ url_for('main.index') }}{% endif %}'">취소</button>
                    <button class="btn-submit" type="submit">{% if post %}수정 완료{% else %}작성 완료{% endif %}</button>
                </div>

            </form>
        </div>
    </main>
</body>
</html>
